name: Bol-infographics

on:
  schedule:
    - cron: '17 2 * * *'        # elke nacht om ca. 03:17 / 04:17 Nederlandse tijd
  workflow_dispatch:
    inputs:
      only_skus:
        description: "Alleen deze configurable sku's, komma-gescheiden (leeg = de instelling ONLY_SKUS of alles)"
        required: false

permissions:
  contents: write

concurrency:
  group: bol-infographics
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Vorige uitvoer ophalen (zodat alleen wijzigingen opnieuw gemaakt worden)
        run: |
          mkdir -p site
          if git fetch --depth=1 origin gh-pages; then git archive origin/gh-pages | tar -x -C site; fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installeren
        run: |
          npm install --no-audit --no-fund
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Afbeeldingen en feed maken
        env:
          MAGENTO_URL: ${{ secrets.MAGENTO_URL }}
          MAGENTO_TOKEN: ${{ secrets.MAGENTO_TOKEN }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          ONLY_SKUS: ${{ inputs.only_skus || vars.ONLY_SKUS }}
          MISSING_LIKE: ${{ vars.MISSING_LIKE || 'Varomed%' }}
        run: python generate.py

      - name: Publiceren
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          enable_jekyll: false
